name: Version-based Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建（即使版本已存在）'
        required: false
        type: boolean
        default: true
      update_existing_release:
        description: '更新已存在的 Release（覆盖旧文件）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # 版本检测工作
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version should trigger release
        id: check
        run: |
          # 获取当前版本
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 检查是否是package.json变更触发的
          if [ "${{ github.event_name }}" = "push" ]; then
            # 检查package.json是否在本次提交中被修改
            if git diff --name-only HEAD~1 HEAD | grep -q "package.json"; then
              echo "📝 package.json was modified in this commit"
          
              # 检查版本号是否真的变更了
              PREV_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" || echo "0.0.0")
              echo "Previous version: $PREV_VERSION"
              echo "Current version: $VERSION"
          
              if [ "$VERSION" != "$PREV_VERSION" ]; then
                echo "✅ Version changed from $PREV_VERSION to $VERSION"
          
                # 检查标签是否存在
                if git tag -l | grep -q "^v$VERSION$"; then
                  echo "tag_exists=true" >> $GITHUB_OUTPUT
                  echo "should_release=false" >> $GITHUB_OUTPUT
                  echo "⚠️ Tag v$VERSION already exists, skipping release"
                else
                  echo "tag_exists=false" >> $GITHUB_OUTPUT
                  echo "should_release=true" >> $GITHUB_OUTPUT
                  echo "🚀 Will create release for v$VERSION"
                fi
              else
                echo "should_release=false" >> $GITHUB_OUTPUT
                echo "⏭️ Version unchanged, skipping release"
              fi
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "⏭️ package.json not modified, skipping release"
            fi
          else
            # 手动触发的情况
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"

            if git tag -l | grep -q "^v$VERSION$"; then
              echo "tag_exists=true" >> $GITHUB_OUTPUT

              if [[ "$FORCE_REBUILD" == "true" ]]; then
                echo "should_release=true" >> $GITHUB_OUTPUT
                echo "🔄 Manual trigger with force_rebuild: will rebuild v$VERSION"
              else
                echo "should_release=false" >> $GITHUB_OUTPUT
                echo "⚠️ Tag v$VERSION already exists, skipping release (use force_rebuild to override)"
              fi
            else
              echo "tag_exists=false" >> $GITHUB_OUTPUT
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "✅ Manual trigger: will create release for v$VERSION"
            fi
          fi
        shell: bash

  # 准备发布说明
  prepare-release-notes:
    runs-on: ubuntu-latest
    if: needs.detect-version.outputs.should_release == 'true'
    needs: detect-version
    outputs:
      release_body: ${{ steps.generate.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Generate release notes
        id: generate
        run: |
          # 使用外部脚本生成release notes
          node scripts/generate-release-notes.cjs --output="$RUNNER_TEMP/release-notes.md"
          RELEASE_BODY=$(cat "$RUNNER_TEMP/release-notes.md")
          
          # 输出到GitHub Actions
          {
            echo 'release_body<<EOF'
            echo "$RELEASE_BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
        shell: bash

  # 全平台全架构构建
  build-release:
    needs: [detect-version, prepare-release-notes]
    if: needs.detect-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
            rust_target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            target: 'i686-pc-windows-msvc'
            arch: 'x86'
            rust_target: 'i686-pc-windows-msvc'

          # macOS - 移除不支持的 universal-apple-darwin
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
            rust_target: 'aarch64-apple-darwin'

          # Linux - 支持 x64 和 ARM64 架构
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-22.04'
            target: 'aarch64-unknown-linux-gnu'
            arch: 'arm64'
            rust_target: 'aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # 刷新包缓存和清理
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          
          # 安装基础编译依赖
          sudo apt-get install -y build-essential curl wget gnupg software-properties-common file
          
          # 安装 glib-sys 和 GTK 相关依赖
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libatk1.0-dev \
            libxdo-dev libssl-dev \
            libglib2.0-0 libglib2.0-bin gobject-introspection libgirepository1.0-dev \
            libffi-dev patchelf
          
          # 验证 glib pkg-config 文件
          echo "🔍 检查 glib pkg-config 文件..."
          find /usr -name "glib-2.0.pc" 2>/dev/null | head -5
          pkg-config --exists glib-2.0 && echo "✅ glib-2.0 pkg-config 可用" || echo "❌ glib-2.0 pkg-config 不可用"
          
          # 设置和验证 pkg-config 路径
          echo "📋 设置 pkg-config 环境变量..."
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
          echo "📋 当前 PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "📋 pkg-config 库列表:"
          pkg-config --list-all | grep glib || echo "❌ 未找到 glib 相关库"
          
          # 尝试手动检查 glib 版本
          pkg-config --modversion glib-2.0 || echo "❌ 无法获取 glib-2.0 版本"
          
          # ARM64 交叉编译设置
          if [[ "${{ matrix.rust_target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "🔧 设置 ARM64 交叉编译环境..."
          
            # 添加 ARM64 架构
            sudo dpkg --add-architecture arm64
          
            # 备份原始 sources.list
            sudo cp /etc/apt/sources.list /etc/apt/sources.list.backup
          
            # 配置多架构源
            {
              echo "# AMD64 (默认架构)"
              echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse"
              echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse"
              echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse"
              echo ""
              echo "# ARM64 架构"
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse"
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse"
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse"
            } | sudo tee /etc/apt/sources.list
          
            # 更新包列表
            sudo apt-get update || true
          
            # 安装交叉编译工具链
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          
            # 尝试安装 ARM64 开发库
            echo "🔧 安装 ARM64 开发库..."
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev:arm64 \
              libgtk-3-dev:arm64 \
              libglib2.0-dev:arm64 \
              libgdk-pixbuf2.0-dev:arm64 \
              libpango1.0-dev:arm64 \
              libatk1.0-dev:arm64 \
              libssl-dev:arm64 \
              libxdo-dev:arm64 \
              libayatana-appindicator3-dev:arm64 \
              librsvg2-dev:arm64 || {
                echo "⚠️ 部分 ARM64 库安装失败，尝试单独安装关键库..."
                sudo apt-get install -y libssl-dev:arm64 libxdo-dev:arm64 || echo "❌ 关键库安装失败"
              }
            
            # 验证关键库
            echo "🔍 验证 ARM64 库安装状态..."
            dpkg -l | grep -E "(libssl.*arm64|libxdo.*arm64)" || echo "⚠️ 部分 ARM64 库可能未正确安装"
          fi
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup additional macOS targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 禁用 npm 缓存，确保每次都获取最新的构建
          # cache: 'npm'

      - name: Setup Windows Build Environment
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Output "Setting up Windows build environment..."

          # Run our setup script
          powershell -ExecutionPolicy Bypass -File scripts/setup-windows-build.ps1 -Force

          Write-Output "Windows build environment setup completed"

      - name: Clean and install dependencies
        run: |
          # 显示环境信息
          echo "📦 Node version: $(node -v)"
          echo "📦 npm version: $(npm -v)"

          # 清除可能存在的旧构建产物
          rm -rf dist node_modules/.vite 2>/dev/null || true

          # 安装依赖
          npm ci

          # 预构建前端以确保 CSS 样式正确包含
          echo "🔨 Pre-building frontend..."
          npm run build

          # 验证构建产物
          echo "📋 Checking build output..."
          ls -la dist/ || dir dist
          ls -la dist/assets/ 2>/dev/null || dir dist\\assets 2>/dev/null || echo "assets dir check"

          # 验证 CSS 文件是否存在
          echo "📋 CSS files in dist:"
          find dist -name "*.css" 2>/dev/null || dir /s /b dist\\*.css 2>/dev/null || echo "No CSS files found directly"

          # 验证图标文件
          echo "📋 Icon files check:"
          ls -la dist/icons/completion/ 2>/dev/null || dir dist\\icons\\completion 2>/dev/null || echo "Icons directory check"
        shell: bash

      # 字体文件已包含在仓库中，无需下载
      # - name: Download fonts for offline use
      #   run: |
      #     echo "📦 下载字体文件用于离线使用..."
      #     node scripts/download-fonts-ci.cjs
      #     echo "✅ 字体下载完成"

      # Tauri 2.0 使用内置 WiX 支持，不需要验证 cargo-wix
      # - name: Verify Windows Build Environment
      #   if: matrix.platform == 'windows-latest'
      #   run: |
      #     Write-Output "Verifying Windows build environment..."
      #     Write-Output "Tauri 2.0 uses built-in WiX support"
      #     Write-Output "Windows build environment verified"
      #   shell: pwsh

      # 检查并准备 Release（处理强制重建的情况）
      - name: Prepare Release for Update
        if: needs.detect-version.outputs.tag_exists == 'true'
        run: |
          echo "🔄 Release v${{ needs.detect-version.outputs.version }} already exists"
          echo "📝 Will update existing release with new build artifacts"

          # 检查 release 是否存在
          if gh release view "v${{ needs.detect-version.outputs.version }}" &>/dev/null; then
            echo "✅ Release exists, new artifacts will be uploaded with --clobber"
          else
            echo "⚠️ Tag exists but release not found, will create new release"
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Windows 构建 - 使用 Tauri 2.0 内置 WiX 支持构建 NSIS 和 MSI
      - name: Build Windows Packages (Tauri)
        if: matrix.platform == 'windows-latest'
        id: windows_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ENABLE_EMBEDDED_SERVER: false
          DISABLE_CONSOLE_LOGS: true
        with:
          tagName: v${{ needs.detect-version.outputs.version }}
          releaseName: 'InfloWave v${{ needs.detect-version.outputs.version }}'
          releaseBody: ${{ needs.prepare-release-notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          # 使用默认配置，同时构建 NSIS 和 MSI
          args: --target ${{ matrix.rust_target }} --config src-tauri/tauri.conf.json -- --locked

      # MSI 已通过 tauri-action 自动构建（使用 Tauri 2.0 内置 WiX 支持）
      # 不需要单独的构建步骤

      - name: Build Windows Portable ZIP Packages
        if: matrix.platform == 'windows-latest'
        id: windows_zip_build
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Output "Building Windows Portable ZIP packages..."
          Write-Output "Target: ${{ matrix.rust_target }}"

          # Use our portable ZIP build script (creates extract-and-run ZIP package)
          powershell -ExecutionPolicy Bypass -File scripts/build-windows-portable-zip.ps1 -Target ${{ matrix.rust_target }} -SkipBuild -Verbose

      - name: Build Windows MSIX (Microsoft Store) - Info Only
        if: matrix.platform == 'windows-latest'
        id: windows_msix_build
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Output "MSIX packaging info:"
          Write-Output "Tauri 2.0 doesn't have native MSIX support yet."
          Write-Output "For Microsoft Store submission, use MSIX Packaging Tool to convert the generated .exe installer."
          Write-Output "Generated installer will be available in the release assets."



      - name: Test AppImage validation
        if: matrix.rust_target == 'x86_64-unknown-linux-gnu'
        run: node --test scripts/test-appimage-validation.cjs

      # 非 Windows 平台使用 Tauri 构建
      - name: Build Non-Windows Platforms
        if: matrix.platform != 'windows-latest'
        id: standard_build
        continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ENABLE_EMBEDDED_SERVER: false
          DISABLE_CONSOLE_LOGS: true
          # 跨编译环境变量
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
          PKG_CONFIG_PATH: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' }}
          PKG_CONFIG_LIBDIR: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos-latest' && '10.15' || '' }}
          # ARM64 交叉编译环境变量
          CC_aarch64_unknown_linux_gnu: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-g++' || '' }}
          AR_aarch64_unknown_linux_gnu: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-ar' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          # OpenSSL 交叉编译配置
          OPENSSL_DIR: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu' || '/usr' }}
          OPENSSL_LIB_DIR: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu' || '/usr/lib/x86_64-linux-gnu' }}
          OPENSSL_INCLUDE_DIR: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/include' || '/usr/include' }}
          # glib-sys 特定环境变量
          GLIB_SYS_USE_PKG_CONFIG: 1
          GOBJECT_SYS_USE_PKG_CONFIG: 1
          GIO_SYS_USE_PKG_CONFIG: 1
          # AppImage 优化配置
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPIMAGE_PATH: src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/InfloWave_${{ needs.detect-version.outputs.version }}_amd64.AppImage
        with:
          # 在 tauri-action 上传之前校验已完成的 x64 AppImage。
          tauriScript: ${{ matrix.rust_target == 'x86_64-unknown-linux-gnu' && 'node scripts/tauri-appimage-build.cjs' || '' }}
          tagName: v${{ needs.detect-version.outputs.version }}
          releaseName: 'InfloWave v${{ needs.detect-version.outputs.version }}'
          releaseBody: ${{ needs.prepare-release-notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          # 根据平台和架构选择正确的配置文件
          args: --target ${{ matrix.rust_target }} --verbose --config ${{
            matrix.platform == 'macos-latest' && 'src-tauri/tauri.macos.conf.json' ||
            (matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'src-tauri/tauri.arm64.conf.json' ||
            'src-tauri/tauri.linux.conf.json') }} -- --locked

      # macOS 专用上传步骤 - 处理 DMG 打包脚本失败但文件已生成的情况
      - name: Upload macOS Packages (Fallback)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          echo "🔍 Checking for macOS bundle files..."

          # 查找生成的包文件
          FOUND_FILES=0
          for bundle_dir in "src-tauri/target/${{ matrix.rust_target }}/release/bundle" "src-tauri/target/release/bundle"; do
            if [[ -d "$bundle_dir" ]]; then
              echo "📂 Searching in: $bundle_dir"

              # 查找 DMG 文件
              while IFS= read -r -d '' file; do
                if [[ -f "$file" ]]; then
                  echo "📦 Found DMG: $file"
                  FOUND_FILES=$((FOUND_FILES + 1))

                  # 尝试上传
                  if gh release upload "v${{ needs.detect-version.outputs.version }}" "$file" --clobber 2>/dev/null; then
                    echo "✅ Successfully uploaded: $(basename "$file")"
                  else
                    echo "⚠️ Upload may have failed or file already exists: $(basename "$file")"
                  fi
                fi
              done < <(find "$bundle_dir" -name "*.dmg" -print0 2>/dev/null)

              # 查找 APP 文件（打包为 tar.gz）
              while IFS= read -r -d '' file; do
                if [[ -d "$file" ]]; then
                  echo "📦 Found APP: $file"
                  APP_NAME=$(basename "$file")
                  TAR_NAME="${APP_NAME%.app}_${{ matrix.rust_target }}.app.tar.gz"

                  # 打包 .app 目录
                  tar -czf "$TAR_NAME" -C "$(dirname "$file")" "$APP_NAME"

                  if [[ -f "$TAR_NAME" ]]; then
                    FOUND_FILES=$((FOUND_FILES + 1))
                    echo "📦 Created archive: $TAR_NAME"

                    # 尝试上传
                    if gh release upload "v${{ needs.detect-version.outputs.version }}" "$TAR_NAME" --clobber 2>/dev/null; then
                      echo "✅ Successfully uploaded: $TAR_NAME"
                    else
                      echo "⚠️ Upload may have failed or file already exists: $TAR_NAME"
                    fi
                  fi
                fi
              done < <(find "$bundle_dir/macos" -name "*.app" -type d -print0 2>/dev/null)
            fi
          done

          if [[ $FOUND_FILES -eq 0 ]]; then
            echo "⚠️ No macOS bundle files found"
            echo "📋 Listing target directory structure for debugging..."
            find src-tauri/target -type f -name "*.dmg" 2>/dev/null || echo "No DMG files found"
            find src-tauri/target -type d -name "*.app" 2>/dev/null || echo "No APP bundles found"
          else
            echo "✅ Found and processed $FOUND_FILES file(s)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 备用上传方案 - Linux 平台
      - name: Upload Linux Packages (Fallback)
        if: matrix.platform != 'windows-latest' && matrix.platform != 'macos-latest' && steps.standard_build.outcome == 'failure'
        shell: bash
        run: |
          echo "Tauri action failed, attempting manual upload..."

          # Linux 包通常在这些位置
          for bundle_dir in "src-tauri/target/${{ matrix.rust_target }}/release/bundle" "src-tauri/target/release/bundle"; do
            if [[ -d "$bundle_dir" ]]; then
              find "$bundle_dir" -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" | while read file; do
                if [[ -f "$file" ]]; then
                  if [[ "$file" == *.AppImage ]]; then
                    node scripts/validate-appimage.cjs "$file"
                  fi
                  echo "Uploading: $file"
                  gh release upload "v${{ needs.detect-version.outputs.version }}" "$file" --clobber || echo "Upload failed for $file"
                fi
              done
            fi
          done

          # 如果没有找到任何文件，列出目录结构进行调试
          echo "Debug: Listing target directory structure..."
          find src-tauri/target -type f -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" 2>/dev/null || echo "No bundle files found"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # MSI 文件已通过 tauri-action 自动上传
      # 不需要单独的上传步骤

      # Windows MSIX 文件上传到 Release
      - name: Upload Windows MSIX to Release
        if: matrix.platform == 'windows-latest' && steps.windows_msix_build.outcome == 'success'
        shell: pwsh
        run: |
          Write-Output "Uploading Windows MSIX files to Release..."

          # 查找 MSIX 文件
          $msixFiles = @()
          $searchPaths = @(
            "src-tauri\target\${{ matrix.rust_target }}\release\bundle\msix\*.msix",
            "src-tauri\target\release\bundle\msix\*.msix"
          )

          foreach ($path in $searchPaths) {
            $files = Get-ChildItem $path -ErrorAction SilentlyContinue
            if ($files) {
              $msixFiles += $files
              break
            }
          }

          if ($msixFiles) {
            foreach ($msixFile in $msixFiles) {
              $fileName = $msixFile.Name
              $filePath = $msixFile.FullName

              Write-Output "Uploading MSIX file: $fileName"

              # 使用 GitHub CLI 上传文件到 Release
              gh release upload "v${{ needs.detect-version.outputs.version }}" "$filePath" --clobber
            }
            Write-Output "Windows MSIX files uploaded successfully"
          } else {
            Write-Output "⚠️ No MSIX files found to upload"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Windows Portable ZIP 文件上传到 Release
      - name: Upload Windows Portable ZIP to Release
        if: matrix.platform == 'windows-latest' && steps.windows_zip_build.outcome == 'success'
        shell: pwsh
        run: |
          Write-Output "Uploading Windows Portable ZIP files to Release..."

          # 查找 ZIP 文件
          $zipFiles = @()
          $searchPaths = @(
            "src-tauri\target\${{ matrix.rust_target }}\release\bundle\zip\*.zip",
            "src-tauri\target\release\bundle\zip\*.zip",
            "src-tauri\target\bundle\zip\*.zip"
          )

          Write-Output "Searching for ZIP files in:"
          foreach ($path in $searchPaths) {
            Write-Output "  - $path"
            $files = Get-ChildItem $path -ErrorAction SilentlyContinue
            if ($files) {
              Write-Output "    Found $($files.Count) file(s)"
              $zipFiles += $files
            }
          }

          if ($zipFiles) {
            foreach ($zipFile in $zipFiles) {
              $fileName = $zipFile.Name
              $filePath = $zipFile.FullName
              $fileSize = [math]::Round($zipFile.Length / 1MB, 2)

              Write-Output "Uploading ZIP file: $fileName ($fileSize MB)"

              # 使用 GitHub CLI 上传文件到 Release
              gh release upload "v${{ needs.detect-version.outputs.version }}" "$filePath" --clobber

              if ($LASTEXITCODE -eq 0) {
                Write-Output "  ✅ Uploaded successfully: $fileName"
              } else {
                Write-Output "  ⚠️ Upload may have failed for: $fileName"
              }
            }
            Write-Output "Windows Portable ZIP files upload completed"
          } else {
            Write-Output "⚠️ No ZIP files found to upload"
            Write-Output "Listing bundle directory contents for debugging:"
            Get-ChildItem "src-tauri\target" -Recurse -Include "*.zip" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output "  Found: $($_.FullName)"
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # 调用独立的 R2 上传 workflow（可选，如需禁用请注释掉此 job）
  upload-to-r2:
    needs: [detect-version, build-release]
    if: needs.detect-version.outputs.should_release == 'true'
    uses: ./.github/workflows/upload-to-r2.yml
    secrets: inherit
    with:
      version: ${{ needs.detect-version.outputs.version }}
      # 默认上传 macOS ARM64 和 Windows x64 MSI
      upload_macos_arm64: true
      upload_windows_x64_msi: true
      # 其他包默认不上传，可根据需要修改
      upload_macos_x64: false
      upload_windows_x64_nsis: false
      upload_windows_x86_msi: false
      upload_windows_x86_nsis: false
      upload_linux_x64_deb: false
      upload_linux_x64_rpm: false
      upload_linux_x64_appimage: false
      upload_linux_arm64_deb: false
      upload_linux_arm64_rpm: false
      upload_linux_arm64_appimage: false
      # 更新选项
      update_release_notes: true
      update_readme: true
